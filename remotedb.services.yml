services:
  plugin.manager.remotedb.authentication:
    class: Drupal\remotedb\AuthenticationPluginManager
    parent: default_plugin_manager
  plugin.manager.remotedb.transport:
    class: Drupal\remotedb\TransportPluginManager
    parent: default_plugin_manager
  logger.channel.remotedb:
    parent: logger.channel_base
    arguments: ['remotedb']
  remotedb.string_lib:
    class: Drupal\remotedb\Component\StringLib
    arguments: []
  remotedb.access_checker:
    class: Drupal\remotedb\Access\RemotedbAccessChecker
