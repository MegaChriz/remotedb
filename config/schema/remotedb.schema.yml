# Schema for configuration files of the Remote database module.

remotedb.remotedb.*:
  type: config_entity
  label: 'Remote database'
  mapping:
    name:
      type: string
      label: 'Machine name'
    label:
      type: label
      label: 'Label'
    url:
      type: uri
      label: 'Url to the remote database.'
    transport:
      type: string
      label: 'Transport plugin'
    transport_settings:
      type: sequence
      label: 'Transport settings'
      sequence:
        type: remotedb.transport_settings.[%key]
    authentication_methods:
      type: sequence
      label: 'Enabled authentication methods'
      sequence:
        type: remotedb.authentication_method
    dependencies:
      type: config_dependencies
      label: 'Dependencies'

remotedb.authentication_method:
  type: mapping
  label: 'Authentication method'
  mapping:
    id:
      type: string
      label: 'ID'
    provider:
      type: string
      label: 'Provider'
    status:
      type: boolean
      label: 'Status'
    weight:
      type: integer
      label: 'Weight'
    settings:
      type: remotedb.authentication_method_settings.[%parent.id]

remotedb.authentication_method_settings.*:
  type: sequence
  label: 'Authentication method settings'
  sequence:
    type: string
    label: 'Value'

remotedb.authentication_method_settings.login:
  type: remotedb.authentication_method
  label: 'Login'
  mapping:
    username:
      type: string
      label: 'Username'
    password:
      type: string
      label: 'Password'

remotedb.transport_settings.*:
  type: mapping
  label: 'Transport settings'

remotedb.transport_settings.rest:
  type: mapping
  label: 'REST settings'
  mapping:
    prefix:
      type: string
      label: 'REST path prefix'
